version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: maternal_db
    restart: unless-stopped
    ports:
      - "75698:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maternal_network
    environment:
      - POSTGRES_DB=dbtoolmnq1233332g_gg_
      - POSTGRES_USER=ruijg833tthecjgps_8ksd___
      - POSTGRES_PASSWORD=1@#$$$#!@FDSfsdvkv-smdkfj--skdh++sdihfsd

  # Django Backend
  web:
    build: .
    container_name: maternal_backend
    restart: unless-stopped
    command: gunicorn maternal_backend.wsgi:application --bind 0.0.0.0:8003 --workers 3 --timeout 120
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maternal_network

  # Nginx Proxy Manager
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      - '80:80'      # HTTP
      - '443:443'    # HTTPS
      - '81:81'      # Admin Web Interface
    volumes:
      - nginx_proxy_data:/data
      - nginx_proxy_letsencrypt:/etc/letsencrypt
    networks:
      - maternal_network
    depends_on:
      - web

  # Nginx (for serving static files)
  nginx:
    image: nginx:alpine
    container_name: maternal_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - maternal_network

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  nginx_proxy_data:
    driver: local
  nginx_proxy_letsencrypt:
    driver: local

networks:
  maternal_network:
    driver: bridge

